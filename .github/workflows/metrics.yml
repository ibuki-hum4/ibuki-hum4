name: Metrics

on:
  schedule:
    - cron: "43 14 * * *" # 毎日 23:43 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          # 個人用トークン(リポジトリの Secrets に METRICS_TOKEN として登録)
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          committer_message: "chore: update metrics [skip ci]"
          filename: assets/metrics.svg
          user: ibuki-hum4
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Tokyo
          plugin_languages: yes
          plugin_languages_ignored: html, css, dockerfile, makefile, shell
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          retries: 3
          retries_delay: 300

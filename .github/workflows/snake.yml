name: Snake

on:
  schedule:
    - cron: "17 15 * * *" # 毎日 0:17 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0a0a0a&color_dots=#ebedf0,#f9c9bf,#f2937f,#e8452c,#a82a16
            dist/snake-dark.svg?color_snake=#e6e6e6&color_dots=#161616,#5a1d13,#8f2b1b,#c93a23,#e8452c

      - name: Push to output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: update snake [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
